# Exposed-substrate NPTH mounting-hole definitions.
#
# The drill and mask-opening diameters mirror the NPTH mechanical diameters in
# kicad-footprint-generator's data/mounting_hardware/mounting_hole/hole_sizes.yaml.
# Each entry expands into Center, Edge, and Corner footprints. Edge and Corner
# point toward +X and +X/+Y respectively; rotate the footprint to face the
# required board edge(s).

schema: amemb.mounting_hole.exposed_substrate.v1

source:
  generator: mounting_hardware/mounting_hole
  definition: data/mounting_hardware/mounting_hole/hole_sizes.yaml
  revision: 9d5b3f76364cfd307ec06d2137f387d18b6768a0

default_parameters:
  library: amemb-MountingHole
  footprint_name: '{name}_ExposedSubstrate{variant_suffix}'
  description: >-
    Exposed-substrate non-plated mounting hole, {drill:g}mm drill,
    {mask_keepout_diameter:g}mm top and bottom solder-mask opening, with copper
    prohibited on every copper layer to 0.2mm beyond the mask-opening boundary
  tags:
    - mountinghole
    - npth
    - exposed-substrate

  hole:
    type: np_thru_hole
    plated: false
    position: [0.0, 0.0]

  solder_mask_keepout:
    layers: [F.Mask, B.Mask]
    primitive: filled_region

  copper_keepout:
    layers: all_copper
    mechanism: npth_local_clearance_plus_extension_rule_area
    expansion_from_mask_boundary: 0.2
    tracks: not_allowed
    vias: not_allowed
    pads: not_allowed
    copper_pours: not_allowed
    footprints: allowed

  edge_extension: 5.0
  courtyard_offset: 0.25

variants:
  Center:
    variant_suffix: ''
    shape: circle
  Edge:
    variant_suffix: _Edge
    shape: circle_with_outward_extension
    outward_directions: [+X]
  Corner:
    variant_suffix: _Corner
    shape: circle_with_outward_extension
    outward_directions: [+X, +Y]

footprints:
  - name: MountingHole_2mm
    source_id: MountingHole_2mm
    drill: 2.0
    mask_keepout_diameter: 4.0

