resistor:
  fp_lib_name: Backplane_Passives_Most
  size_definitions:
  - resistor_chip.yaml
  - resistor_chip_smaller_0603.yaml
  - resistor_chip_wide_body.yaml
  ipc_reference: ipc_spec_larger_or_equal_0603
  prefix: R
  description: Resistor SMD {code_imperial:s} ({code_metric:s} Metric), square (rectangular)
    end terminal, most material; generated from pinned upstream IPC-7351B rule table,
    {size_info:s}
  keywords: resistor
  ipc_density: most
  pad_length_addition: 0
  suffix: ''
resistor_smaller_0402:
  fp_lib_name: Backplane_Passives_Most
  size_definitions:
